spring.application.name=auth-service

# Database (override via env vars in docker)
spring.datasource.url=jdbc:postgresql://${DB_IP:db}:${DB_PORT:5432}/${DB_DBNAME:auth-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
security.jwt.secret=${JWT_SECRET:8266984d92c88bc7cea6a4edcdb0db91470316cf69c4e004d57be2a92095b4fd}
security.jwt.expiration-ms=${JWT_EXP_MS:86400000}

# Downstream services
user.service.base-url=${USER_SERVICE_URL:http://localhost:8081}

# Internal communication token for trusted service-to-service calls
internal.token=${INTERNAL_TOKEN:8e7bb9c7-3f2e-4a9e-9c0f-1d2a4b5c6d7e}

# Server port (optional)
server.port=${AUTH_SERVICE_PORT:8080}
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=debug

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Synchronization Queue Configuration
rabbitmq.exchange.sync=synchronization.exchange
rabbitmq.queue.auth.sync.user=auth.sync.user.queue
rabbitmq.routing.key.sync.user=sync.user
