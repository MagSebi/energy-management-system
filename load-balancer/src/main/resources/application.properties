server.port=${SERVER_PORT:8090}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Central consumption from device data exchange
rabbitmq.exchange.device=device.data.exchange
rabbitmq.routing.key.central=device.data.routing.key
rabbitmq.queue.central=device.data.central.queue

# Replica ingest routing keys
rabbitmq.routing.keys.ingest=device.data.ingest.1,device.data.ingest.2

logging.level.com.example.lb=INFO
