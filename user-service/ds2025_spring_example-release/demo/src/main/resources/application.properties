spring.application.name=demo

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
# ia valorile din variabilele de mediu DB_* (cu default-uri pentru local)
database.ip=${DB_IP:db}
database.port=${DB_PORT:5432}
database.user=${DB_USER:postgres}
database.password=${DB_PASSWORD:root}
database.name=${DB_DBNAME:example-db}

spring.datasource.url=jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}
spring.sql.init.platform=postgres

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true_

# Security
security.jwt.secret=${JWT_SECRET:8266984d92c88bc7cea6a4edcdb0db91470316cf69c4e004d57be2a92095b4fd}

# Ports
server.port=${SERVER_PORT:8081}
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=debug

# Upstream services
auth.service.base-url=${AUTH_SERVICE_URL:http://localhost:8080}
internal.token=${INTERNAL_TOKEN:8e7bb9c7-3f2e-4a9e-9c0f-1d2a4b5c6d7e}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Synchronization Queue Configuration
rabbitmq.exchange.sync=synchronization.exchange
rabbitmq.routing.key.sync.user=sync.user
rabbitmq.queue.user.sync.auth=user.sync.auth.queue
rabbitmq.routing.key.sync.device=sync.device
rabbitmq.queue.user.sync.device=user.sync.device.queue

